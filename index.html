
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reconocimiento de 5 objetos</title>

    <!-- Librerías -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <style>

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #eeeeee;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #222;
        }

        button {
            background-color: #007bff;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        button:disabled {
            background-color: gray;
        }

        #webcam-container {
            margin: 20px auto;
        }

        canvas {
            border: 4px solid black;
            border-radius: 10px;
            max-width: 100%;
        }

        .contenedor-leds {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 30px;
        }

        .led-box {
            background: white;
            width: 110px;
            padding: 15px;
            border-radius: 12px;
        }

        .led {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: #333333;
            border: 3px solid #222;
            margin: 10px auto;
        }

        #resultado {
            font-size: 22px;
            margin-top: 25px;
        }

        #estado {
            color: #444;
        }

    </style>

</head>

<body>

    <h1>RECONOCIMIENTO DE 5 OBJETOS</h1>

    <h3>Teachable Machine + Cámara</h3>

    <button id="btnIniciar" onclick="iniciarCamara()">
        PRENDER CÁMARA
    </button>

    <p id="estado">Cámara apagada</p>

    <div id="webcam-container"></div>

    <h2>LED DIGITALES</h2>

    <div class="contenedor-leds">

        <div class="led-box">
            <p>OBJETO 1</p>
            <div id="led0" class="led"></div>
            <p>ROJO</p>
        </div>

        <div class="led-box">
            <p>OBJETO 2</p>
            <div id="led1" class="led"></div>
            <p>VERDE</p>
        </div>

        <div class="led-box">
            <p>OBJETO 3</p>
            <div id="led2" class="led"></div>
            <p>AZUL</p>
        </div>

        <div class="led-box">
            <p>OBJETO 4</p>
            <div id="led3" class="led"></div>
            <p>AMARILLO</p>
        </div>

        <div class="led-box">
            <p>OBJETO 5</p>
            <div id="led4" class="led"></div>
            <p>MORADO</p>
        </div>

    </div>

    <h2 id="resultado">ESPERANDO OBJETO...</h2>

    <script>

        // ==================================
        // CONFIGURACIÓN DEL MODELO LOCAL
        // ==================================

        const URL = "./modelo/";

        let model;
        let webcam;
        let ejecutando = false;

        const colores = [
            "red",
            "lime",
            "blue",
            "yellow",
            "purple"
        ];

        // ==================================
        // INICIAR CÁMARA
        // ==================================

        async function iniciarCamara() {

            const boton = document.getElementById("btnIniciar");

            boton.disabled = true;

            try {

                document.getElementById("estado").innerText =
                    "Cargando modelo local...";

                // Cargar modelo de la computadora
                const modelURL = URL + "model.json";
                const metadataURL = URL + "metadata.json";

                model = await tmImage.load(
                    modelURL,
                    metadataURL
                );

                // Verificar las clases
                if (model.getTotalClasses() < 5) {
                    throw new Error(
                        "El modelo necesita al menos 5 clases."
                    );
                }

                document.getElementById("estado").innerText =
                    "Solicitando permiso para la cámara...";

                // Activar cámara
                webcam = new tmImage.Webcam(
                    320,
                    320,
                    true
                );

                await webcam.setup();

                await webcam.play();

                document.getElementById("webcam-container").innerHTML = "";

                document.getElementById("webcam-container")
                    .appendChild(webcam.canvas);

                document.getElementById("estado").innerText =
                    "CÁMARA ENCENDIDA CORRECTAMENTE";

                document.getElementById("resultado").innerText =
                    "MUESTRA UN OBJETO";

                ejecutando = true;

                boton.innerText = "CÁMARA ENCENDIDA";

                window.requestAnimationFrame(loop);

            }

            catch (error) {

                console.error(error);

                document.getElementById("estado").innerText =
                    "ERROR AL INICIAR";

                document.getElementById("resultado").innerText =
                    error.message;

                alert("ERROR: " + error.message);

                boton.disabled = false;

            }

        }

        // ==================================
        // RECONOCIMIENTO CONTINUO
        // ==================================

        async function loop() {

            if (!ejecutando) return;

            webcam.update();

            await predecir();

            window.requestAnimationFrame(loop);

        }

        // ==================================
        // IDENTIFICAR LOS 5 OBJETOS
        // ==================================

        async function predecir() {

            const predicciones = await model.predict(
                webcam.canvas
            );

            let mayor = 0;
            let clase = -1;

            // Buscar la predicción más alta
            for (let i = 0; i < predicciones.length; i++) {

                if (predicciones[i].probability > mayor) {

                    mayor = predicciones[i].probability;

                    clase = i;

                }

            }

            // Apagar todos los LEDs primero
            apagarLEDs();

            // Si reconoce un objeto con 90% o más
            if (
                clase >= 0 &&
                clase < 5 &&
                mayor >= 0.90
            ) {

                // Encender LED correspondiente
                document.getElementById("led" + clase)
                    .style.backgroundColor = colores[clase];

                document.getElementById("resultado").innerText =
                    "OBJETO DETECTADO: " +
                    predicciones[clase].className +
                    " - " +
                    (mayor * 100).toFixed(1) + "%";

            }

            else {

                document.getElementById("resultado").innerText =
                    "FONDO O NINGÚN OBJETO";

            }

        }

        // ==================================
        // APAGAR LOS 5 LEDS
        // ==================================

        function apagarLEDs() {

            for (let i = 0; i < 5; i++) {

                document.getElementById("led" + i)
                    .style.backgroundColor = "#333333";

            }

        }

    </script>

</body>

</html>
